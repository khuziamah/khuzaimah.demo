<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign Up - Cybersecurity Expert</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #0a0a0a;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .signup-container {
      background: #333;
      padding: 40px;
      border-radius: 15px;
      width: 400px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .signup-container h2 {
      margin-bottom: 20px;
    }

    .form-control {
      margin-bottom: 15px;
    }

    .signup-btn {
      background: #28a745;
      border: none;
      color: #fff;
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .signup-btn:hover {
      background: #218838;
    }

    .login-link {
      margin-top: 15px;
      color: #ccc;
    }

    .login-link a {
      color: #28a745;
      text-decoration: none;
    }

    .login-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="signup-container">
    <h2>Create Your Account</h2>
    <input type="email" id="signupEmail" class="form-control" placeholder="Enter your email" required />
    <input type="password" id="signupPassword" class="form-control" placeholder="Enter your password" required />
    <button class="signup-btn" onclick="signup()">Sign Up</button>

    <div class="login-link">
      <p>Already have an account? <a href="login.html">Login</a></p>
    </div>
  </div>

  <script>
    function signup() {
      const email = document.getElementById("signupEmail").value.trim();
      const password = document.getElementById("signupPassword").value.trim();

      if (!email || !password) {
        alert("Please enter both email and password.");
        return;
      }

      const newUser = { email, password };

      // Get existing users or start fresh
      let users = JSON.parse(localStorage.getItem("users")) || [];

      // Check if user already exists
      const exists = users.some(user => user.email === email);
      if (exists) {
        alert("User already exists. Please login.");
        window.location.href = "login.html";
        return;
      }

      // Add new user and store in localStorage
      users.push(newUser);
      localStorage.setItem("users", JSON.stringify(users));

      alert("Sign-up successful!");
      window.location.href = "welcome.html"; // ✅ Go to welcome page
    }
  </script>

</body>
</html>
