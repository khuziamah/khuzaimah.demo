<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - Cybersecurity Expert</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #0a0a0a;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    .login-container {
      background: #333;
      padding: 40px;
      border-radius: 15px;
      width: 400px;
      text-align: center;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .login-container h2 {
      margin-bottom: 20px;
    }

    .form-control {
      margin-bottom: 15px;
    }

    .login-btn {
      background: #7367f0;
      border: none;
      color: #fff;
      padding: 10px 20px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
    }

    .login-btn:hover {
      background: #5e50ee;
    }

    .signup-link {
      margin-top: 15px;
      color: #ccc;
    }

    .signup-link a {
      color: #7367f0;
      text-decoration: none;
    }

    .signup-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <h2>Login to Cybersecurity Expert</h2>
    <input type="email" id="loginEmail" class="form-control" placeholder="Enter your email" required />
    <input type="password" id="loginPassword" class="form-control" placeholder="Enter your password" required />
    <button class="login-btn" onclick="login()">Login</button>

    <div class="signup-link">
      <p>Don't have an account? <a href="signup.html">Sign up</a></p>
    </div>
  </div>

  <script>
    // Default user
    const defaultUser = { email: "khuzaimahtech@gmail.com", password: "123" };

    // Check and add default user to localStorage if no users exist
    if (!localStorage.getItem('users')) {
      localStorage.setItem('users', JSON.stringify([defaultUser]));
    } else {
      const users = JSON.parse(localStorage.getItem('users'));
      const exists = users.some(user => user.email === defaultUser.email);
      if (!exists) {
        users.push(defaultUser);
        localStorage.setItem('users', JSON.stringify(users));
      }
    }

    function login() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value.trim();

      const users = JSON.parse(localStorage.getItem('users')) || [];

      const foundUser = users.find(user => user.email === email && user.password === password);

      if (foundUser) {
        alert("Login successful!");
        window.location.href = "welcome.html";
      } else {
        alert("Invalid email or password.");
      }
    }
  </script>

</body>
</html>
